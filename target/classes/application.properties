# Application Configuration
spring.application.name=smart-attendance-system
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/attendance_db
spring.data.mongodb.auto-index-creation=true

# Spring Security & JWT Configuration
smartattend.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
smartattend.jwt.expiration-ms=86400000

# Gemini AI API Configuration
smartattend.gemini.api-key=${GEMINI_API_KEY:}
smartattend.gemini.model=gemini-1.5-flash
smartattend.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# File Upload Limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.com.smartattend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=INFO
